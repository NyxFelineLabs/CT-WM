[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-wm"
version = "0.1.0"
description = "Calibrated world-model prediction and offline O-RAN planning experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NyxFelineLabs"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.1", "pandas>=1.5", "scipy>=1.10"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29,<2", "stable-baselines3>=2.7,<3"]
plots = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/NyxFelineLabs/CT-WM"
Issues = "https://github.com/NyxFelineLabs/CT-WM/issues"
Documentation = "https://github.com/NyxFelineLabs/CT-WM/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
